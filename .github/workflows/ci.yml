name: ci

# Every push to main: the checks, the build, and, for a version no release
# carries yet, a release with the built files.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # The shared-memory protocols on processors that move plain accesses
  # (ordering.itest.js): x86 does not, so the job below cannot answer that.
  arm64:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
        env:
          CELLAR_EXPECT_REORDERING: '1'
      - run: npm run test:ordering
        env:
          CELLAR_EXPECT_REORDERING: '1'

  check-and-build:
    needs: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cellar-dist
          path: dist/
      - name: Release the version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          draft="$(gh release view "$version" --json isDraft -q .isDraft 2>/dev/null || echo none)"
          if [ "$draft" = "false" ]; then
            echo "$version is released already"
            exit 0
          fi
          # A draft is what a release that failed half way left: made again.
          if [ "$draft" = "true" ]; then
            gh release delete "$version" --yes
          fi
          (cd dist && tar czf ../cellar-types.tar.gz types)
          gh release create "$version" --target "$GITHUB_SHA" --title "Cellar $version" \
            --notes "Built from $GITHUB_SHA." \
            dist/cellar.js dist/cellar.min.js dist/checksums.json cellar-types.tar.gz
